name: "confido_dbt"
version: "1.0.0"
config-version: 2
require-dbt-version: [">=1.12.0", "<2.0.0"]

# Must match the profile name in ~/.dbt/profiles.yml
profile: "default"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  confido_dbt:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
