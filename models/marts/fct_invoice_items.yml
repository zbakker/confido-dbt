models:
  - name: fct_invoice_items
    description: >
      One row per line item on a paid invoice, with the dollar amount and
      references to Confido internal products, global customers and
      distribution centers where the data supports them. Quantities are converted to
      cases (Operations), packs and singles (Manufacturing), with a check on
      whether the line's unit price supports reading its quantity as cases. Unresolved references
      are null. Unpaid invoices are excluded; the full set of lines (paid and
      unpaid) is reconciled to staging in int_invoice_items_enriched.
    columns:
      - name: invoice_item_id
        description: Primary key. The source invoice item ID.
        data_tests:
          - unique
          - not_null
      - name: invoice_id
        description: The invoice the line belongs to.
        data_tests:
          - not_null
      - name: invoice_number
        description: Invoice number from the accounting system. Not guaranteed unique.
      - name: company_detail_id
        description: >
          The company (Confido's customer, the brand) that issued the invoice. Global
          customers are shared across companies, so filter or group by company
          before comparing brands at the same customer.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_confido__company_details')
                field: company_detail_id
      - name: company_name
        description: Name of the company.
        data_tests:
          - not_null
      - name: product_id
        description: Confido product. Set only when the line's item links to exactly one product.
      - name: product_name
        description: Name of the Confido product. Null whenever product_id is null.
      - name: product_mapping_status
        description: >
          mapped; ambiguous_item (the item links to several products);
          no_linked_product (e.g. services, discounts, trade spend);
          unknown_item (the item remote ID matches no item).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['mapped', 'ambiguous_item', 'no_linked_product', 'unknown_item']
      - name: invoiced_product_level
        description: >
          Level of the line's product: case, shipper, pack or single. Every mapped
          line in current data is a case. Null whenever product_id is null.
      - name: global_customer_id
        description: Confido global customer, from the invoice's contact or that contact's parent.
      - name: global_customer_name
        description: Name of the Confido global customer. Null whenever global_customer_id is null.
      - name: global_customer_mapping_status
        description: >
          direct; via_parent (inherited from the parent contact);
          unmapped_contact (the contact exists but has no global customer);
          unknown_contact (the customer remote ID matches no contact).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['direct', 'via_parent', 'unmapped_contact', 'unknown_contact']
      - name: distribution_center_id
        description: >
          Confido distribution center from the invoice's contact
          (contacts.distribution_center_id). Null on every row in current data,
          because no contact carries a DC. Distribution centers also belong to
          global customers, but a global customer has many DCs (plus one
          "All Other DCs" catch-all), so the customer alone can't identify which
          DC an invoice relates to.
      - name: distribution_center_name
        description: Name of the Confido distribution center. Null whenever distribution_center_id is null.
      - name: item_id
        description: >
          Confido's internal ID for the accounting system item (stg_confido__items.item_id).
          Joins straight to the items table, including for lines with no product.
          Null only when the item remote ID matches no item (product_mapping_status = 'unknown_item').
      - name: item_remote_id
        description: Accounting system item ID, kept for traceability.
      - name: item_name
        description: >
          Accounting system item name (e.g. "Yogurt", "Services", "Early Pay 2% Discount").
          The only description of what was sold when product_id is null.
      - name: customer_remote_id
        description: Accounting system customer ID, kept for traceability.
      - name: contact_id
        description: >
          Confido's internal ID for the accounting system contact (stg_confido__contacts.contact_id).
      - name: contact_name
        description: >
          Accounting system customer name. Identifies the customer when
          global_customer_id is null because the contact isn't mapped (e.g. Kroger,
          Trader Joe's). Null when the customer remote ID matches no contact
          (unknown_contact, GENERATED_ IDs).
      - name: quantity
        description: The invoice line quantity as synced from the accounting system, unconverted.
      - name: quantity_uom
        description: >
          What quantity counts: case when the invoiced product is a case or shipper,
          otherwise the invoiced product's level. Null when the line has no product
          (unconverted). Checked by quantity_price_check.
      - name: unit_price
        description: The invoice line unit price as synced, in currency_code.
      - name: case_product_id
        description: >
          The case the line's quantity converts through: the invoiced product when
          it's a case or shipper, otherwise the case its shipping config names for
          this customer, DC and invoice date.
      - name: case_product_name
        description: Name of the case product.
      - name: case_source
        description: invoiced_product or shipping_config. Null when no case was found.
      - name: packs_per_case
        description: Packs in one case (e.g. 8 multipacks). Null when the case holds singles directly.
      - name: singles_per_case
        description: Singles in one case through every level (e.g. 8 cups, or 32 cups in a multipack case).
      - name: single_product_id
        description: >
          The single inside the case, for manufacturing. Set only when the case holds
          one kind; null for shippers and mixed packs (single_quantity is still the total).
      - name: single_product_name
        description: Name of the single product.
      - name: case_quantity
        description: Line quantity in cases (Operations). Null when the line has no product or no case.
      - name: pack_quantity
        description: Line quantity in packs. Null when the case has no pack level.
      - name: single_quantity
        description: Line quantity in singles, the individual units (Manufacturing).
      - name: expected_case_price
        description: >
          Price of the case product from product_prices: the most specific price
          (DC, then global customer, then default) in effect on the invoice date.
          Forecast scenario prices are ignored.
      - name: expected_amount
        description: >
          What the line should have been billed: case_quantity x expected_case_price.
          Compare with amount, or sum by invoice_id and compare with the invoice's
          product lines. For lines billed as singles or packs a gap points at the
          product_relationships factors; for lines billed as cases (all current data)
          the rollup isn't used, so a gap means a price difference or a quantity that
          isn't a case count. Null when case_quantity or expected_case_price is null.
      - name: implied_case_quantity
        description: >
          Cases the line's dollars imply: amount / expected_case_price. Doesn't use the
          quantity field, so it still gives a case estimate when the quantity is a
          dollar figure or a lump sum (not_a_case_price). Approximate: assumes the
          line was billed at the expected price.
      - name: quantity_price_check
        description: >
          Whether the line's unit price looks like a case price, i.e. whether the
          converted quantities can be trusted. matches_case_price (within 1%);
          differs_from_case_price (within 2x: a customer price difference, quantity
          still cases); not_a_case_price (e.g. quantity 1 with the line total as unit
          price, or the GEN_ batch with unit price 1; don't use the converted
          quantities); no_case_price (no product or no price to compare).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['matches_case_price', 'differs_from_case_price', 'not_a_case_price', 'no_case_price']
      - name: amount
        description: Line amount in currency_code, rounded to cents. Negative for deductions.
        data_tests:
          - not_null
      - name: is_deduction
        description: >
          True when amount is negative. Assumes negative lines are deductions
          taken off the invoice (e.g. EDLP, retailer spoils, early pay discount)
          rather than refunds. The same deduction items sometimes appear with
          positive amounts, so this follows the sign, not the item.
        data_tests:
          - not_null
      - name: currency_code
        description: ISO currency code from the invoice. Null on some invoices; don't sum across currencies.
      - name: paid_on_date
        description: Date the invoice was paid.
      - name: is_paid
        description: True when the invoice has a paid_on_date. Every invoice in the current data has one.
        data_tests:
          - not_null
      - name: invoice_created_at
        description: When the invoice was created in the source. UTC, no time zone.
